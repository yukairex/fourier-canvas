<script type="text/babel">
// Fourier math + path utilities
// DFT: take N complex samples of a path, return N {freq, amp, phase} descriptors

// Unsorted DFT: out[k] is the coefficient for bin k (signed freq). Uses a
// twiddle table so 2048-sample image paths stay fast.
function dftRaw(samples) {
  const N = samples.length;
  const cosT = new Float64Array(N), sinT = new Float64Array(N);
  for (let m = 0; m < N; m++) {
    cosT[m] = Math.cos((2 * Math.PI * m) / N);
    sinT[m] = Math.sin((2 * Math.PI * m) / N);
  }
  const out = [];
  for (let k = 0; k < N; k++) {
    let re = 0, im = 0, m = 0;
    for (let n = 0; n < N; n++) {
      const cos = cosT[m], sin = sinT[m];
      re += samples[n].x * cos + samples[n].y * sin;
      im += -samples[n].x * sin + samples[n].y * cos;
      m += k; if (m >= N) m -= N;
    }
    re /= N;
    im /= N;
    // Remap to signed frequency: k in [N/2, N) becomes k - N (negative freq).
    const freq = k < N / 2 ? k : k - N;
    out.push({ re, im, freq, amp: Math.sqrt(re * re + im * im), phase: Math.atan2(im, re) });
  }
  return out;
}

function dft(samples) {
  // Sort by amp descending for best visual tracing
  return dftRaw(samples).sort((a, b) => b.amp - a.amp);
}

// Resample a polyline into N evenly-spaced points along its arc length.
function resamplePath(points, N) {
  if (points.length < 2) return points.slice();
  // compute cumulative arc length
  const cum = [0];
  for (let i = 1; i < points.length; i++) {
    const dx = points[i].x - points[i - 1].x;
    const dy = points[i].y - points[i - 1].y;
    cum.push(cum[i - 1] + Math.hypot(dx, dy));
  }
  const total = cum[cum.length - 1];
  if (total === 0) return [points[0]];
  const out = [];
  for (let i = 0; i < N; i++) {
    const t = (i / N) * total;
    // find segment
    let lo = 0, hi = cum.length - 1;
    while (lo < hi - 1) {
      const mid = (lo + hi) >> 1;
      if (cum[mid] <= t) lo = mid;
      else hi = mid;
    }
    const segLen = cum[hi] - cum[lo] || 1;
    const localT = (t - cum[lo]) / segLen;
    out.push({
      x: points[lo].x + (points[hi].x - points[lo].x) * localT,
      y: points[lo].y + (points[hi].y - points[lo].y) * localT,
    });
  }
  return out;
}

// Ensure closed loop (append first point)
function closePath(points) {
  if (points.length < 2) return points;
  const a = points[0];
  const b = points[points.length - 1];
  if (Math.hypot(a.x - b.x, a.y - b.y) > 0.5) {
    return [...points, { x: a.x, y: a.y }];
  }
  return points;
}

// Center path to origin and return {centered, bbox}
function centerPath(points) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of points) {
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x;
    if (p.y > maxY) maxY = p.y;
  }
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  return {
    centered: points.map((p) => ({ x: p.x - cx, y: p.y - cy })),
    bbox: { minX, minY, maxX, maxY, cx, cy, w: maxX - minX, h: maxY - minY },
  };
}

// Evaluate the Fourier series at time t (0..1) with the top K coefficients.
// Returns array of vector tip positions (the last one is the drawing tip).
function evalFourier(coeffs, t, K, phaseOffset = 0) {
  let x = 0, y = 0;
  const tips = [{ x: 0, y: 0 }];
  const limit = Math.min(K, coeffs.length);
  for (let i = 0; i < limit; i++) {
    const c = coeffs[i];
    const angle = c.freq * 2 * Math.PI * t + c.phase + phaseOffset;
    x += c.amp * Math.cos(angle);
    y += c.amp * Math.sin(angle);
    tips.push({ x, y });
  }
  return tips;
}

// Tip position only (no allocations) — used for sub-stepped tracing.
function fourierTip(coeffs, t, K, phaseOffset = 0) {
  let x = 0, y = 0;
  const limit = Math.min(K, coeffs.length);
  for (let i = 0; i < limit; i++) {
    const c = coeffs[i];
    const angle = c.freq * 2 * Math.PI * t + c.phase + phaseOffset;
    x += c.amp * Math.cos(angle);
    y += c.amp * Math.sin(angle);
  }
  return { x, y };
}

// ── Morph ────────────────────────────────────────────────────────────────
// Prepare two closed paths for coefficient-space interpolation: same sample
// count, matched size, and B rotated/reversed so its start point and winding
// line up with A (otherwise the morph twists through itself).
function prepareMorph(pathA, pathB, M = 512) {
  const norm = (pts) => {
    const r = resamplePath(closePath(pts), M);
    let mx = 0, my = 0;
    for (const p of r) { mx += p.x; my += p.y; }
    mx /= r.length; my /= r.length;
    const c = r.map((p) => ({ x: p.x - mx, y: p.y - my }));
    let rms = 0;
    for (const p of c) rms += p.x * p.x + p.y * p.y;
    return { pts: c, rms: Math.sqrt(rms / c.length) || 1 };
  };
  const A = norm(pathA), B = norm(pathB);
  const k = A.rms / B.rms;
  const b = B.pts.map((p) => ({ x: p.x * k, y: p.y * k }));
  const a = A.pts;
  let best = { err: Infinity, shift: 0, dir: 1 };
  for (const dir of [1, -1]) {
    for (let shift = 0; shift < M; shift++) {
      let err = 0;
      for (let i = 0; i < M; i += 4) {
        const q = b[(((shift + dir * i) % M) + M) % M];
        const dx = a[i].x - q.x, dy = a[i].y - q.y;
        err += dx * dx + dy * dy;
        if (err >= best.err) break;
      }
      if (err < best.err) best = { err, shift, dir };
    }
  }
  const bAligned = a.map((_, i) => b[(((best.shift + best.dir * i) % M) + M) % M]);
  return { A: dftRaw(a), B: dftRaw(bAligned), pathA: a, pathB: bAligned };
}

// Linear blend in complex coefficient space, sorted by amplitude.
function morphCoeffs(prep, s) {
  const out = new Array(prep.A.length);
  for (let i = 0; i < prep.A.length; i++) {
    const a = prep.A[i], b = prep.B[i];
    const re = a.re + (b.re - a.re) * s;
    const im = a.im + (b.im - a.im) * s;
    out[i] = { re, im, freq: a.freq, amp: Math.sqrt(re * re + im * im), phase: Math.atan2(im, re) };
  }
  return out.sort((x, y) => y.amp - x.amp);
}

// ── Image → path ─────────────────────────────────────────────────────────
// Canny-style edge detection (blur → Sobel → non-max suppression →
// hysteresis), then greedy nearest-neighbour ordering into one long path.
// detail ∈ (0, 1]: fraction of candidate edge pixels kept as strong edges.
function imageToPath(img, detail = 0.25, maxDim = 320) {
  const sc = Math.min(1, maxDim / Math.max(img.width, img.height));
  const W = Math.max(8, Math.round(img.width * sc));
  const H = Math.max(8, Math.round(img.height * sc));
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(img, 0, 0, W, H);
  const data = ctx.getImageData(0, 0, W, H).data;

  const gray = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) {
    gray[i] = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
  }

  // Separable 5-tap Gaussian blur
  const kern = [1, 4, 6, 4, 1];
  const blur = (src, horiz) => {
    const dst = new Float32Array(W * H);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        let acc = 0;
        for (let j = -2; j <= 2; j++) {
          const xx = horiz ? Math.min(W - 1, Math.max(0, x + j)) : x;
          const yy = horiz ? y : Math.min(H - 1, Math.max(0, y + j));
          acc += src[yy * W + xx] * kern[j + 2];
        }
        dst[y * W + x] = acc / 16;
      }
    }
    return dst;
  };
  const g = blur(blur(gray, true), false);

  // Sobel
  const mag = new Float32Array(W * H);
  const dirBin = new Uint8Array(W * H);
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      const gx = -g[i - W - 1] - 2 * g[i - 1] - g[i + W - 1] + g[i - W + 1] + 2 * g[i + 1] + g[i + W + 1];
      const gy = -g[i - W - 1] - 2 * g[i - W] - g[i - W + 1] + g[i + W - 1] + 2 * g[i + W] + g[i + W + 1];
      mag[i] = Math.hypot(gx, gy);
      let a = (Math.atan2(gy, gx) * 180) / Math.PI;
      if (a < 0) a += 180;
      dirBin[i] = a < 22.5 || a >= 157.5 ? 0 : a < 67.5 ? 1 : a < 112.5 ? 2 : 3;
    }
  }

  // Non-max suppression
  const nms = new Float32Array(W * H);
  const offs = [[1, 0], [1, 1], [0, 1], [-1, 1]];
  const cand = [];
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      const m = mag[i];
      if (m < 4) continue;
      const [dx, dy] = offs[dirBin[i]];
      if (m >= mag[i + dy * W + dx] && m >= mag[i - dy * W - dx]) {
        nms[i] = m;
        cand.push(m);
      }
    }
  }
  if (cand.length === 0) return null;

  // Hysteresis thresholds from the candidate distribution
  cand.sort((p, q) => q - p);
  const keep = Math.min(1, Math.max(0.01, detail));
  const high = cand[Math.min(cand.length - 1, Math.floor(cand.length * keep))];
  const low = high * 0.45;
  const edge = new Uint8Array(W * H);
  const stack = [];
  for (let i = 0; i < W * H; i++) {
    if (nms[i] >= high && !edge[i]) {
      edge[i] = 1; stack.push(i);
      while (stack.length) {
        const j = stack.pop();
        const jx = j % W, jy = (j / W) | 0;
        for (let oy = -1; oy <= 1; oy++) {
          for (let ox = -1; ox <= 1; ox++) {
            const nx = jx + ox, ny = jy + oy;
            if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
            const n = ny * W + nx;
            if (!edge[n] && nms[n] >= low) { edge[n] = 1; stack.push(n); }
          }
        }
      }
    }
  }

  const pts = [];
  for (let i = 0; i < W * H; i++) if (edge[i]) pts.push({ x: i % W, y: (i / W) | 0 });
  if (pts.length < 8) return null;

  // Greedy nearest-neighbour ordering with a spatial grid
  const CELL = 6;
  const gw = Math.ceil(W / CELL), gh = Math.ceil(H / CELL);
  const grid = Array.from({ length: gw * gh }, () => []);
  pts.forEach((p, i) => grid[((p.y / CELL) | 0) * gw + ((p.x / CELL) | 0)].push(i));
  const used = new Uint8Array(pts.length);
  let remaining = pts.length;
  const order = [];
  let cur = 0;
  used[0] = 1; remaining--; order.push(pts[0]);
  while (remaining > 0) {
    const p = pts[cur];
    const pcx = (p.x / CELL) | 0, pcy = (p.y / CELL) | 0;
    let bestI = -1, bestD = Infinity;
    for (let ring = 0; ring <= Math.max(gw, gh); ring++) {
      for (let cy = pcy - ring; cy <= pcy + ring; cy++) {
        if (cy < 0 || cy >= gh) continue;
        for (let cx = pcx - ring; cx <= pcx + ring; cx++) {
          if (cx < 0 || cx >= gw) continue;
          if (ring > 0 && cy !== pcy - ring && cy !== pcy + ring && cx !== pcx - ring && cx !== pcx + ring) continue;
          const bucket = grid[cy * gw + cx];
          for (let b = bucket.length - 1; b >= 0; b--) {
            const j = bucket[b];
            if (used[j]) { bucket.splice(b, 1); continue; }
            const d = (pts[j].x - p.x) ** 2 + (pts[j].y - p.y) ** 2;
            if (d < bestD) { bestD = d; bestI = j; }
          }
        }
      }
      // Anything found within this ring is guaranteed nearer than the next ring
      if (bestI >= 0 && Math.sqrt(bestD) <= ring * CELL) break;
    }
    if (bestI < 0) break;
    used[bestI] = 1; remaining--;
    order.push(pts[bestI]);
    cur = bestI;
  }

  // Fit into the same ~520px world box the presets use
  const s2 = 520 / Math.max(W, H);
  return order.map((p) => ({ x: (p.x - W / 2) * s2, y: (p.y - H / 2) * s2 }));
}

Object.assign(window, { dft, dftRaw, resamplePath, closePath, centerPath, evalFourier, fourierTip, prepareMorph, morphCoeffs, imageToPath });

</script>
<script type="text/babel">
// Preset closed curves. Each returns an array of {x, y} in a ~600x600 box centered at 0.
// Points are densely sampled along the parametric curve.

function presetHeart(steps = 400) {
  const pts = [];
  for (let i = 0; i < steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    pts.push({ x: x * 14, y: y * 14 });
  }
  return pts;
}

function presetStar(steps = 400, points = 5) {
  const pts = [];
  const R = 230, r = 95;
  const verts = [];
  for (let i = 0; i < points * 2; i++) {
    const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
    const rad = i % 2 === 0 ? R : r;
    verts.push({ x: Math.cos(a) * rad, y: Math.sin(a) * rad });
  }
  // resample along polyline
  const cum = [0];
  for (let i = 1; i <= verts.length; i++) {
    const p0 = verts[(i - 1) % verts.length];
    const p1 = verts[i % verts.length];
    cum.push(cum[cum.length - 1] + Math.hypot(p1.x - p0.x, p1.y - p0.y));
  }
  const total = cum[cum.length - 1];
  for (let i = 0; i < steps; i++) {
    const d = (i / steps) * total;
    let lo = 0;
    while (lo < cum.length - 1 && cum[lo + 1] < d) lo++;
    const segLen = cum[lo + 1] - cum[lo] || 1;
    const t = (d - cum[lo]) / segLen;
    const p0 = verts[lo % verts.length];
    const p1 = verts[(lo + 1) % verts.length];
    pts.push({ x: p0.x + (p1.x - p0.x) * t, y: p0.y + (p1.y - p0.y) * t });
  }
  return pts;
}

function presetInfinity(steps = 400) {
  const pts = [];
  const a = 240;
  for (let i = 0; i < steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    const denom = 1 + Math.sin(t) * Math.sin(t);
    pts.push({ x: (a * Math.cos(t)) / denom, y: (a * Math.sin(t) * Math.cos(t)) / denom });
  }
  return pts;
}

function presetFlower(steps = 500, petals = 6) {
  const pts = [];
  for (let i = 0; i < steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    const r = 180 + 70 * Math.cos(petals * t);
    pts.push({ x: r * Math.cos(t), y: r * Math.sin(t) });
  }
  return pts;
}

function presetSquare(steps = 400) {
  const size = 220;
  const corners = [
    { x: -size, y: -size },
    { x: size, y: -size },
    { x: size, y: size },
    { x: -size, y: size },
  ];
  const pts = [];
  for (let c = 0; c < 4; c++) {
    const p0 = corners[c];
    const p1 = corners[(c + 1) % 4];
    const per = steps / 4;
    for (let i = 0; i < per; i++) {
      const t = i / per;
      pts.push({ x: p0.x + (p1.x - p0.x) * t, y: p0.y + (p1.y - p0.y) * t });
    }
  }
  return pts;
}

// A stylized treble-like spiral squiggle
function presetSpiral(steps = 500) {
  const pts = [];
  for (let i = 0; i < steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    const r = 180 * (1 + 0.4 * Math.sin(3 * t));
    const a = t + 0.8 * Math.sin(2 * t);
    pts.push({ x: r * Math.cos(a), y: r * Math.sin(a) });
  }
  return pts;
}

// 3:2 Lissajous figure with π/4 phase offset
function presetLissajous(steps = 600) {
  const pts = [];
  for (let i = 0; i < steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    pts.push({ x: 210 * Math.sin(3 * t + Math.PI / 4), y: 210 * Math.sin(2 * t) });
  }
  return pts;
}

// 5-cusp epicycloid: rolling circle R=160, r=40
function presetEpicycloid(steps = 600) {
  const pts = [];
  for (let i = 0; i < steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    pts.push({
      x: 200 * Math.cos(t) - 40 * Math.cos(5 * t),
      y: 200 * Math.sin(t) - 40 * Math.sin(5 * t),
    });
  }
  return pts;
}

// 3-cusped hypocycloid (deltoid)
function presetDeltoid(steps = 600) {
  const pts = [];
  for (let i = 0; i < steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    pts.push({
      x: 160 * Math.cos(t) + 80 * Math.cos(2 * t),
      y: 160 * Math.sin(t) - 80 * Math.sin(2 * t),
    });
  }
  return pts;
}

const PRESETS = {
  heart:      { label: 'Heart',      fn: presetHeart },
  star:       { label: 'Star',       fn: presetStar },
  infinity:   { label: 'Lemniscate', fn: presetInfinity },
  flower:     { label: 'Rosette',    fn: presetFlower },
  square:     { label: 'Square',     fn: presetSquare },
  spiral:     { label: 'Spiral',     fn: presetSpiral },
  lissajous:  { label: 'Lissajous',  fn: presetLissajous },
  epicycloid: { label: 'Epicycloid', fn: presetEpicycloid },
  deltoid:    { label: 'Deltoid',    fn: presetDeltoid },
};

window.PRESETS = PRESETS;

</script>
<script type="text/babel">
// i18n translations for Fourier Canvas.
// Supported langs: en, zh, ja, fr, es

const I18N = {
  en: {

<script type="text/babel">
// Vector Studio: directly edit a small set of (freq, amp, phase) vectors.

const { useState: useStudioState } = React;

function genDefaultVectors() {
  // A pleasing starter: two counter-rotating vectors → ellipse-ish
  return [
    { id: 1, freq:  1, amp: 160, phase: 0 },
    { id: 2, freq: -3, amp:  60, phase: 1.0 },
    { id: 3, freq:  5, amp:  24, phase: 0.4 },
  ];
}

// Render the studio panel (fills the left rail area when in studio mode).
function VectorStudio({ vectors, setVectors, theme, tr }) {
  const nextId = React.useRef(
    vectors.reduce((m, v) => Math.max(m, v.id), 0) + 1
  );

  const update = (id, key, val) => {
    setVectors((vs) => vs.map((v) => v.id === id ? { ...v, [key]: val } : v));
  };
  const remove = (id) => {
    setVectors((vs) => vs.filter((v) => v.id !== id));
  };
  const add = () => {
    const id = nextId.current++;
    setVectors((vs) => [...vs, { id, freq: vs.length + 1, amp: 40, phase: 0 }]);
  };
  const reset = () => {
    const starters = genDefaultVectors();
    nextId.current = starters.length + 1;
    setVectors(starters);
  };
  const randomize = () => {
    setVectors((vs) => vs.map((v) => ({
      ...v,
      freq: Math.round((Math.random() * 2 - 1) * 8) || 1,
      amp: 20 + Math.random() * 180,
      phase: Math.random() * Math.PI * 2,
    })));
  };

  return (
    <section style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <SectionLabel theme={theme}>{tr ? tr.vectorsLabel(vectors.length) : `Vectors · ${vectors.length}`}</SectionLabel>
        <div style={{ display: 'flex', gap: 6 }}>
          <Button small theme={theme} onClick={randomize}>{tr ? tr.randomize : 'Randomize'}</Button>
          <Button small theme={theme} onClick={reset}>{tr ? tr.reset : 'Reset'}</Button>
        </div>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {vectors.map((v, i) => (
          <VectorCard key={v.id} v={v} i={i} theme={theme} tr={tr} onChange={update} onRemove={remove} canRemove={vectors.length > 1} />
        ))}
      </div>

      <button
        onClick={add}
        style={{
          padding: '10px', background: 'transparent',
          border: `1px dashed ${theme.line}`,
          borderRadius: 6, color: theme.muted,
          fontSize: 11, fontFamily: 'JetBrains Mono, monospace',
          letterSpacing: 2, textTransform: 'uppercase',
          cursor: 'pointer',
        }}
      >{ tr ? tr.addVector : '+ Add vector' }</button>
    </section>
  );
}

function VectorCard({ v, i, theme, tr, onChange, onRemove, canRemove }) {
  // Little swatch color cycling through accents for identity
  const hue = (i * 47) % 360;
  return (
    <div style={{
      border: `1px solid ${theme.line}`,
      borderRadius: 8,
      padding: '10px 12px',
      background: theme.bg === theme.panel ? 'transparent' : theme.bg,
    }}>
      <div style={{
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        marginBottom: 8,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{
            width: 10, height: 10, borderRadius: 99,
            background: `hsl(${hue} 65% 52%)`,
            display: 'inline-block',
          }} />
          <span style={{
            fontFamily: 'JetBrains Mono, monospace',
            fontSize: 11, color: theme.ink, fontWeight: 500,
          }}>
            v{String(i + 1).padStart(2, '0')}
          </span>
          <span style={{
            fontFamily: 'JetBrains Mono, monospace',
            fontSize: 10, color: theme.muted,
          }}>
            {v.amp.toFixed(0)} · e^(i·{v.freq}·2πt{v.phase >= 0 ? '+' : ''}{v.phase.toFixed(2)})
          </span>
        </div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        <MiniSlider label={tr ? tr.freq  : 'freq'}  value={v.freq}  min={-10} max={10}     step={1}    theme={theme}
          onChange={(x) => onChange(v.id, 'freq', x)}  format={(x) => `${x > 0 ? '+' : ''}${x}`} />
        <MiniSlider label={tr ? tr.amp   : 'amp'}   value={v.amp}   min={0}   max={260}    step={1}    theme={theme}
          onChange={(x) => onChange(v.id, 'amp', x)}   format={(x) => `${x.toFixed(0)}`} />
        <MiniSlider label={tr ? tr.phase : 'phase'} value={v.phase} min={0}   max={6.2832} step={0.01} theme={theme}
          onChange={(x) => onChange(v.id, 'phase', x)} format={(x) => `${(x / Math.PI).toFixed(2)}π`} />
      </div>
      {canRemove && (
        <button
          onClick={() => onRemove(v.id)}
          style={{
            marginTop: 4, padding: '4px 8px', fontSize: 10,
            background: 'transparent', color: theme.muted,
            border: `1px solid ${theme.line}`, borderRadius: 4,
            cursor: 'pointer', fontFamily: 'Inter, sans-serif',
          }}
        >{tr ? tr.removeVector : 'Remove vector'}</button>
      )}
    </div>
  );
}

function MiniSlider({ label, value, min, max, step, onChange, format, theme }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '36px 1fr 48px', alignItems: 'center', gap: 8 }}>
      <span style={{
        fontFamily: 'JetBrains Mono, monospace', fontSize: 10,
        color: theme.muted, letterSpacing: 1, textTransform: 'uppercase',
      }}>{label}</span>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={(e) => onChange(parseFloat(e.target.value))}
        style={{ width: '100%', accentColor: theme.accent, height: 3 }} />
      <span style={{
        fontFamily: 'JetBrains Mono, monospace', fontSize: 10.5, color: theme.ink,
        textAlign: 'right',
      }}>{format ? format(value) : value}</span>
    </div>
  );
}

// Build a synthetic coeffs array from studio vectors for FourierCanvas to consume.
function vectorsToCoeffs(vectors) {
  // Sort by amp descending so largest-first (matches drawn-path behavior).
  const sorted = [...vectors].filter((v) => v.amp > 0).sort((a, b) => b.amp - a.amp);
  return sorted.map((v) => ({
    freq: v.freq,
    amp: v.amp,
    phase: v.phase,
    re: v.amp * Math.cos(v.phase),
    im: v.amp * Math.sin(v.phase),
  }));
}

Object.assign(window, { VectorStudio, genDefaultVectors, vectorsToCoeffs });

</script>
<script type="text/babel">
// FourierCanvas: drawing + animation + zoom/pan.

function FourierCanvas({
  theme, coeffs, userPath,
  N, speed, playing, showCircles, showVectors, showUserPath, trailMode,
  onDrawStart, onDrawPoint, onDrawEnd, canDraw,
  onTimeUpdate,
  traceColor, traceWidth, phaseOffset,
  seekRef, canvasRefOut, isRecording,
  morph, onMorphUpdate, live,
}) {
  const canvasRef = React.useRef(null);
  const overlayRef = React.useRef(null);
  const containerRef = React.useRef(null);
  const [dims, setDims] = React.useState({ w: 800, h: 600 });

  // Zoom/pan state (refs for perf in animation loop)
  const viewRef = React.useRef({ scale: 1, ox: 0, oy: 0 }); // ox,oy = pan offset in canvas px
  const [viewState, setViewState] = React.useState({ scale: 1, ox: 0, oy: 0 }); // for overlay re-draw
  const panRef = React.useRef(null); // { startX, startY, startOx, startOy }

  const tRef = React.useRef(0);
  const tracePtsRef = React.useRef([]);
  const rafRef = React.useRef(0);
  const lastTsRef = React.useRef(0);
  const drawingRef = React.useRef(false);
  const traceAdvRef = React.useRef(0); // t covered by the current trace; infinite trail stops after one loop
  const morphPhaseRef = React.useRef(0);

  // Resize observer
  React.useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const ro = new ResizeObserver(() => {
      const r = el.getBoundingClientRect();
      setDims({ w: Math.floor(r.width), h: Math.floor(r.height) });
    });
    ro.observe(el);
    const r = el.getBoundingClientRect();
    setDims({ w: Math.floor(r.width), h: Math.floor(r.height) });
    return () => ro.disconnect();
  }, []);

  // Expose canvas + seek control to parent
  React.useEffect(() => {
    if (canvasRefOut) canvasRefOut.current = canvasRef.current;
    if (seekRef) seekRef.current = (newT) => {
      tRef.current = newT;
      tracePtsRef.current = [];
      traceAdvRef.current = 0;
    };
  });

  // Clear trace when coeffs change
  React.useEffect(() => {
    tracePtsRef.current = [];
    tRef.current = 0;
    traceAdvRef.current = 0;
  }, [coeffs]);

  // Restart the trace when the curve itself changes shape
  React.useEffect(() => {
    tracePtsRef.current = [];
    traceAdvRef.current = 0;
  }, [N, phaseOffset, trailMode]);

  // Reset zoom
  const resetView = () => {
    viewRef.current = { scale: 1, ox: 0, oy: 0 };
    setViewState({ scale: 1, ox: 0, oy: 0 });
  };

  const zoomBy = (factor, cx, cy) => {
    const v = viewRef.current;
    const w = dims.w, h = dims.h;
    const pcx = cx ?? w / 2;
    const pcy = cy ?? h / 2;
    const newScale = Math.min(20, Math.max(0.1, v.scale * factor));
    // Keep world point under cursor fixed:
    // world_pt = (pcx - w/2 - ox) / scale
    // After zoom: pcx = world_pt * newScale + w/2 + newOx
    // => newOx = pcx - w/2 - (pcx - w/2 - ox) * (newScale/scale)
    const newOx = pcx - w / 2 - (pcx - w / 2 - v.ox) * (newScale / v.scale);
    const newOy = pcy - h / 2 - (pcy - h / 2 - v.oy) * (newScale / v.scale);
    const next = { scale: newScale, ox: newOx, oy: newOy };
    viewRef.current = next;
    setViewState({ ...next });
  };

  // Wheel zoom
  React.useEffect(() => {
    const el = canvasRef.current;
    if (!el) return;
    const onWheel = (e) => {
      e.preventDefault();
      const rect = el.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      zoomBy(factor, cx, cy);
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, [dims]);

  // activePointers: tracks all current pointer positions for pinch-to-zoom
  const activePointersRef = React.useRef(new Map());
  const lastPinchRef = React.useRef(null);

  // Overlay: grid + user path (redraws on view change)
  React.useEffect(() => {
    const c = overlayRef.current;
    if (!c) return;
    const dpr = window.devicePixelRatio || 1;
    c.width = dims.w * dpr; c.height = dims.h * dpr;
    c.style.width = dims.w + 'px'; c.style.height = dims.h + 'px';
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, dims.w, dims.h);

    const { scale, ox, oy } = viewRef.current;
    // World origin in canvas coords:
    const cx = dims.w / 2 + ox;
    const cy = dims.h / 2 + oy;

    // Grid (adapt step to zoom level)
    const baseStep = 40;
    const step = baseStep * scale;
    ctx.strokeStyle = theme.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    const startX = (((-cx) / step) | 0) * step + cx % step;
    const startY = (((-cy) / step) | 0) * step + cy % step;
    for (let x = startX; x <= dims.w + step; x += step) {
      ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, dims.h);
    }
    for (let y = startY; y <= dims.h + step; y += step) {
      ctx.moveTo(0, y + 0.5); ctx.lineTo(dims.w, y + 0.5);
    }
    ctx.stroke();

    // Axis lines
    ctx.strokeStyle = theme.gridStrong;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx + 0.5, 0); ctx.lineTo(cx + 0.5, dims.h);
    ctx.moveTo(0, cy + 0.5); ctx.lineTo(dims.w, cy + 0.5);
    ctx.stroke();

    // Origin label
    ctx.fillStyle = theme.muted;
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.fillText('0', cx + 4, cy - 4);

    // User path (pressure-sensitive when stylus data is available)
    if (showUserPath && userPath && userPath.length > 1) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.strokeStyle = theme.user;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const hasPressure = userPath.some((p) => p.pressure !== undefined && p.pressure !== 1);
      if (hasPressure) {
        ctx.setLineDash([]);
        for (let i = 1; i < userPath.length; i++) {
          const pw = Math.max(0.5, (userPath[i].pressure || 1) * 3);
          ctx.lineWidth = pw / scale;
          ctx.beginPath();
          ctx.moveTo(userPath[i - 1].x, userPath[i - 1].y);
          ctx.lineTo(userPath[i].x, userPath[i].y);
          ctx.stroke();
        }
      } else {
        ctx.lineWidth = 1.2 / scale;
        ctx.setLineDash([3 / scale, 4 / scale]);
        ctx.beginPath();
        ctx.moveTo(userPath[0].x, userPath[0].y);
        for (let i = 1; i < userPath.length; i++) ctx.lineTo(userPath[i].x, userPath[i].y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.restore();
    }
  }, [dims, theme, userPath, showUserPath, viewState]);

  // Animation loop
  React.useEffect(() => {
    const c = canvasRef.current;
    if (!c) return;
    const dpr = window.devicePixelRatio || 1;
    c.width = dims.w * dpr; c.height = dims.h * dpr;
    c.style.width = dims.w + 'px'; c.style.height = dims.h + 'px';
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (!morph && !live && (!coeffs || coeffs.length === 0)) {
      ctx.clearRect(0, 0, dims.w, dims.h);
      return;
    }

    const maxAge = trailMode === 'infinite' ? Infinity : trailMode === 'long' ? 3.0 : 1.2;

    const tick = (ts) => {
      if (!lastTsRef.current) lastTsRef.current = ts;
      const dt = Math.min((ts - lastTsRef.current) / 1000, 0.05);
      lastTsRef.current = ts;

      // Morph: blend coefficients each frame; s ping-pongs with an ease.
      let cs = coeffs;
      let morphCurve = null;
      if (morph) {
        let ms = morph.s;
        if (morph.auto) {
          if (playing) morphPhaseRef.current = (morphPhaseRef.current + dt / morph.period) % 1;
          ms = 0.5 - 0.5 * Math.cos(2 * Math.PI * morphPhaseRef.current);
          onMorphUpdate && onMorphUpdate(ms);
        } else {
          morphPhaseRef.current = Math.acos(1 - 2 * ms) / (2 * Math.PI);
        }
        cs = morphCoeffs(morph.prep, ms);
        morphCurve = [];
        for (let i = 0; i <= 400; i++) morphCurve.push(fourierTip(cs, i / 400, N, phaseOffset || 0));
      }
      // Live audio: the analyser swaps coefficients every frame; draw the whole loop.
      if (live) {
        cs = live.current || [];
        if (cs.length) {
          morphCurve = [];
          for (let i = 0; i <= 600; i++) morphCurve.push(fourierTip(cs, i / 600, N, phaseOffset || 0));
        }
      }

      const prevT = tRef.current;
      if (playing) tRef.current = (tRef.current + dt * speed) % 1;
      const t = tRef.current;
      onTimeUpdate && onTimeUpdate(t);

      const tips = evalFourier(cs, t, N, phaseOffset || 0);
      const tip = tips[tips.length - 1];

      // Sub-step the trace so detailed shapes (images) stay smooth at any speed.
      if (playing && !morph && !live && !(maxAge === Infinity && traceAdvRef.current >= 1)) {
        const adv = dt * speed;
        const steps = Math.min(64, Math.max(1, Math.ceil(adv * 2000)));
        for (let k = 1; k <= steps; k++) {
          const tk = prevT + (adv * k) / steps;
          const p = k === steps ? tip : fourierTip(cs, tk % 1, N, phaseOffset || 0);
          tracePtsRef.current.push({ x: p.x, y: p.y, age: (dt * (steps - k)) / steps });
          if (maxAge === Infinity && traceAdvRef.current + (adv * k) / steps >= 1) break;
        }
        traceAdvRef.current += adv;
      }
      for (const p of tracePtsRef.current) p.age += dt;
      if (maxAge !== Infinity) tracePtsRef.current = tracePtsRef.current.filter((p) => p.age < maxAge);

      if (isRecording) {
        ctx.fillStyle = theme.bg;
        ctx.fillRect(0, 0, dims.w, dims.h);
      } else {
        ctx.clearRect(0, 0, dims.w, dims.h);
      }

      const { scale, ox, oy } = viewRef.current;
      const originX = dims.w / 2 + ox;
      const originY = dims.h / 2 + oy;

      ctx.save();
      ctx.translate(originX, originY);
      ctx.scale(scale, scale);

      // Trace
      const trace = tracePtsRef.current;
      const tColor = traceColor || theme.trace;
      const tWidth = traceWidth || 2.2;
      if (morphCurve) {
        ctx.lineWidth = tWidth / scale;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = tColor;
        ctx.beginPath();
        ctx.moveTo(morphCurve[0].x, morphCurve[0].y);
        for (let i = 1; i < morphCurve.length; i++) ctx.lineTo(morphCurve[i].x, morphCurve[i].y);
        ctx.stroke();
      } else if (trace.length > 1 && !live) {
        ctx.lineWidth = tWidth / scale;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (maxAge === Infinity) {
          ctx.strokeStyle = tColor;
          ctx.beginPath();
          ctx.moveTo(trace[0].x, trace[0].y);
          for (let i = 1; i < trace.length; i++) ctx.lineTo(trace[i].x, trace[i].y);
          ctx.stroke();
        } else {
          for (let i = 1; i < trace.length; i++) {
            const a = 1 - trace[i].age / maxAge;
            if (a <= 0) continue;
            ctx.strokeStyle = hexWithAlpha(tColor, a);
            ctx.beginPath();
            ctx.moveTo(trace[i - 1].x, trace[i - 1].y);
            ctx.lineTo(trace[i].x, trace[i].y);
            ctx.stroke();
          }
        }
      }

      // Circles + vectors
      if (showCircles || showVectors) {
        for (let i = 0; i < tips.length - 1; i++) {
          const from = tips[i], to = tips[i + 1];
          const r = Math.hypot(to.x - from.x, to.y - from.y);
          if (showCircles && r > 0.5) {
            ctx.strokeStyle = theme.circle;
            ctx.globalAlpha = Math.max(0.15, 1 - i / Math.max(6, N) * 0.8);
            ctx.lineWidth = 1 / scale;
            ctx.beginPath();
            ctx.arc(from.x, from.y, r, 0, Math.PI * 2);
            ctx.stroke();
          }
          if (showVectors) {
            ctx.globalAlpha = 0.9;
            ctx.strokeStyle = theme.vector;
            ctx.lineWidth = 1.2 / scale;
            ctx.beginPath();
            ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y);
            ctx.stroke();
          }
        }
        ctx.globalAlpha = 1;
      }

      // Tip dot
      if (tips.length > 1) {
        ctx.fillStyle = tColor;
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 4 / scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = theme.panel;
        ctx.lineWidth = 1.5 / scale;
        ctx.stroke();
      }

      ctx.restore();
      rafRef.current = requestAnimationFrame(tick);
    };

    rafRef.current = requestAnimationFrame(tick);
    return () => { cancelAnimationFrame(rafRef.current); lastTsRef.current = 0; };
  }, [dims, theme, coeffs, N, speed, playing, showCircles, showVectors, trailMode, traceColor, traceWidth, phaseOffset, isRecording, morph, live]);

  // Unified pointer events: mouse, touch, stylus — with pressure support and pinch-to-zoom
  const canvasToWorld = (cx, cy, pressure = 1) => {
    const { scale, ox, oy } = viewRef.current;
    return {
      x: (cx - dims.w / 2 - ox) / scale,
      y: (cy - dims.h / 2 - oy) / scale,
      pressure,
    };
  };

  const getPinchState = () => {
    const pts = [...activePointersRef.current.values()];
    if (pts.length < 2) return null;
    const [a, b] = pts;
    return { dist: Math.hypot(a.x - b.x, a.y - b.y), midX: (a.x + b.x) / 2, midY: (a.y + b.y) / 2 };
  };

  const handlePointerDown = (e) => {
    e.preventDefault();
    e.currentTarget.setPointerCapture(e.pointerId);
    const rect = canvasRef.current.getBoundingClientRect();
    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    activePointersRef.current.set(e.pointerId, { x: cx, y: cy });

    if (activePointersRef.current.size === 2) {
      panRef.current = null;
      if (drawingRef.current) { drawingRef.current = false; onDrawEnd(); }
      lastPinchRef.current = getPinchState();
      return;
    }

    const isPan = e.button === 1 || e.button === 2 || !canDraw;
    if (isPan) {
      panRef.current = { startX: cx, startY: cy, startOx: viewRef.current.ox, startOy: viewRef.current.oy };
    } else {
      drawingRef.current = true;
      onDrawStart(canvasToWorld(cx, cy, e.pressure || 1));
    }
  };

  const handlePointerMove = (e) => {
    e.preventDefault();
    const rect = canvasRef.current.getBoundingClientRect();
    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    activePointersRef.current.set(e.pointerId, { x: cx, y: cy });

    if (activePointersRef.current.size >= 2) {
      const pinch = getPinchState();
      if (lastPinchRef.current) {
        zoomBy(pinch.dist / lastPinchRef.current.dist, pinch.midX, pinch.midY);
        const dx = pinch.midX - lastPinchRef.current.midX, dy = pinch.midY - lastPinchRef.current.midY;
        const v = viewRef.current;
        const next = { ...v, ox: v.ox + dx, oy: v.oy + dy };
        viewRef.current = next; setViewState({ ...next });
      }
      lastPinchRef.current = pinch;
      return;
    }

    if (panRef.current) {
      const dx = cx - panRef.current.startX, dy = cy - panRef.current.startY;
      const next = { ...viewRef.current, ox: panRef.current.startOx + dx, oy: panRef.current.startOy + dy };
      viewRef.current = next; setViewState({ ...next });
    } else if (drawingRef.current) {
      onDrawPoint(canvasToWorld(cx, cy, e.pressure || 1));
    }
  };

  const handlePointerUp = (e) => {
    e.preventDefault();
    activePointersRef.current.delete(e.pointerId);
    if (activePointersRef.current.size < 2) lastPinchRef.current = null;
    if (activePointersRef.current.size === 0) {
      if (panRef.current) { panRef.current = null; return; }
      if (drawingRef.current) { drawingRef.current = false; onDrawEnd(); }
    }
  };

  const cursor = panRef.current ? 'grabbing' : (!canDraw ? 'grab' : 'crosshair');

  return (
    <div ref={containerRef} style={{ position: 'relative', width: '100%', height: '100%' }}>
      <canvas ref={overlayRef} style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }} />
      <canvas
        ref={canvasRef}
        onPointerDown={handlePointerDown}
        onPointerMove={handlePointerMove}
        onPointerUp={handlePointerUp}
        onPointerLeave={handlePointerUp}
        onPointerCancel={handlePointerUp}
        onContextMenu={(e) => e.preventDefault()}
        style={{ position: 'absolute', inset: 0, cursor, touchAction: 'none' }}
      />
      {/* Zoom controls */}
      <div style={{
        position: 'absolute', bottom: 18, right: 20, zIndex: 3,
        display: 'flex', flexDirection: 'column', gap: 4,
      }}>
        {[
          { label: '+', action: () => zoomBy(1.25) },
          { label: '⊙', action: resetView, title: 'Reset view' },
          { label: '−', action: () => zoomBy(1 / 1.25) },
        ].map(({ label, action, title }) => (
          <button key={label} onClick={action} title={title}
            style={{
              width: 32, height: 32, borderRadius: 8,
              background: theme.panel, border: `1px solid ${theme.line}`,
              color: theme.ink, fontSize: label === '⊙' ? 14 : 18,
              fontFamily: 'JetBrains Mono, monospace',
              cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
              boxShadow: '0 2px 8px rgba(0,0,0,0.08)',
            }}
          >{label}</button>
        ))}
        <div style={{
          fontSize: 9, color: theme.muted, textAlign: 'center', letterSpacing: 0.5,
          fontFamily: 'JetBrains Mono, monospace',
        }}>{Math.round(viewState.scale * 100)}%</div>
      </div>
    </div>
  );
}

function hexWithAlpha(hex, a) {
  if (hex.startsWith('rgba') || hex.startsWith('rgb')) {
    return hex.replace(/rgba?\(([^)]+)\)/, (m, inner) => {
      const parts = inner.split(',').map((s) => s.trim());
      return `rgba(${parts[0]},${parts[1]},${parts[2]},${a.toFixed(3)})`;
    });
  }
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${a.toFixed(3)})`;
}

Object.assign(window, { FourierCanvas });

</script>
<script type="text/babel">
// 3D Fourier: there is no "3D complex number", so each axis gets a real DFT.
// Grouping the three axes by frequency k gives a(k)·cos + b(k)·sin with a, b in
// R³ — a tilted ellipse. A chain of these ellipses traces the space curve.

// Space-curve presets, sampled uniformly in the curve parameter (not arc
// length) so analytic curves keep their sparse spectra — a trefoil is 4 terms.
const PRESETS_3D = {
  torus:   { label: 'Torus knot', fn: (t, o) => {
    const R = 170, r = 70, p = o.p, q = o.q;
    return { x: (R + r * Math.cos(q * t)) * Math.cos(p * t), y: (R + r * Math.cos(q * t)) * Math.sin(p * t), z: r * Math.sin(q * t) };
  } },
  figure8: { label: 'Figure-eight', fn: (t) => {
    const k = 75;
    return { x: k * (2 + Math.cos(2 * t)) * Math.cos(3 * t), y: k * (2 + Math.cos(2 * t)) * Math.sin(3 * t), z: k * Math.sin(4 * t) };
  } },
  slinky:  { label: 'Slinky', fn: (t) => {
    const R = 170, r = 60;
    return { x: (R + r * Math.cos(16 * t)) * Math.cos(t), y: (R + r * Math.cos(16 * t)) * Math.sin(t), z: r * Math.sin(16 * t) };
  } },
  tennis:  { label: 'Tennis ball', fn: (t) => {
    const a = 150, b = 70, c = 2 * Math.sqrt(a * b);
    return { x: a * Math.cos(t) + b * Math.cos(3 * t), y: a * Math.sin(t) - b * Math.sin(3 * t), z: c * Math.sin(2 * t) };
  } },
  viviani: { label: 'Viviani', fn: (t) => {
    const a = 120;
    return { x: a * Math.cos(2 * t), y: a * Math.sin(2 * t), z: 2 * a * Math.sin(t) };
  } },
  lissajous3d: { label: 'Lissajous 3D', fn: (t) => ({
    x: 220 * Math.sin(3 * t + Math.PI / 2), y: 220 * Math.sin(2 * t), z: 160 * Math.sin(5 * t + Math.PI / 4),
  }) },
};

function sample3d(key, opts, M = 512) {
  const fn = PRESETS_3D[key].fn;
  const out = [];
  for (let i = 0; i < M; i++) out.push(fn((i / M) * Math.PI * 2, opts));
  return out;
}

function dft3d(samples) {
  const M = samples.length;
  const cosT = new Float64Array(M), sinT = new Float64Array(M);
  for (let m = 0; m < M; m++) {
    cosT[m] = Math.cos((2 * Math.PI * m) / M);
    sinT[m] = Math.sin((2 * Math.PI * m) / M);
  }
  let mx = 0, my = 0, mz = 0;
  for (const p of samples) { mx += p.x; my += p.y; mz += p.z; }
  mx /= M; my /= M; mz /= M;
  const P = samples.map((p) => ({ x: p.x - mx, y: p.y - my, z: p.z - mz }));
  const terms = [];
  for (let k = 1; k < M / 2; k++) {
    const a = { x: 0, y: 0, z: 0 }, b = { x: 0, y: 0, z: 0 };
    let m = 0;
    for (let n = 0; n < M; n++) {
      const c = cosT[m], sn = sinT[m], p = P[n];
      a.x += p.x * c; a.y += p.y * c; a.z += p.z * c;
      b.x += p.x * sn; b.y += p.y * sn; b.z += p.z * sn;
      m += k; if (m >= M) m -= M;
    }
    for (const v of [a, b]) { v.x *= 2 / M; v.y *= 2 / M; v.z *= 2 / M; }
    const mag = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z + b.x * b.x + b.y * b.y + b.z * b.z);
    // tilt: angle between the ellipse's plane normal (a × b) and the z axis
    const nx = a.y * b.z - a.z * b.y, ny = a.z * b.x - a.x * b.z, nz = a.x * b.y - a.y * b.x;
    const nl = Math.hypot(nx, ny, nz);
    const tilt = nl > 1e-9 ? Math.acos(Math.min(1, Math.abs(nz) / nl)) : Math.PI / 2;
    terms.push({ k, a, b, mag, tilt });
  }
  terms.sort((u, v) => v.mag - u.mag);
  const max = terms[0]?.mag || 1;
  return terms.filter((t) => t.mag > max * 1e-3).slice(0, 200);
}

function tip3d(terms, t, K) {
  let x = 0, y = 0, z = 0;
  const lim = Math.min(K, terms.length);
  for (let i = 0; i < lim; i++) {
    const { k, a, b } = terms[i];
    const c = Math.cos(2 * Math.PI * k * t), s = Math.sin(2 * Math.PI * k * t);
    x += a.x * c + b.x * s; y += a.y * c + b.y * s; z += a.z * c + b.z * s;
  }
  return { x, y, z };
}

// Rotation: yaw about world z (up), then pitch about screen x.
// Result: x → screen right, y → screen down, z → away from the viewer.
function makeRot(yaw, pitch) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  return (p) => {
    const x1 = p.x * cy - p.y * sy, y1 = p.x * sy + p.y * cy;
    return { x: x1, y: y1 * cp - p.z * sp, z: y1 * sp + p.z * cp };
  };
}

// Orthographic projection of the 3D series onto the current view, as 2D
// complex coefficients — what the sound engine and exports consume.
function project3dToCoeffs(terms, yaw, pitch) {
  const rot = makeRot(yaw, pitch);
  const out = [];
  for (const { k, a, b } of terms) {
    const A = rot(a), B = rot(b);
    // A·cos + B·sin = ½(A − iB)e^{iφ} + ½(A + iB)e^{−iφ}, with A, B as x + iy
    for (const [freq, re, im] of [[k, (A.x + B.y) / 2, (A.y - B.x) / 2], [-k, (A.x - B.y) / 2, (A.y + B.x) / 2]]) {
      const amp = Math.hypot(re, im);
      if (amp > 1e-6) out.push({ freq, re, im, amp, phase: Math.atan2(im, re) });
    }
  }
  return out.sort((u, v) => v.amp - u.amp);
}

function Fourier3DCanvas({
  theme, terms, N, speed, playing, showCircles, showVectors, showUserPath, trailMode,
  traceColor, traceWidth, onTimeUpdate, seekRef, canvasRefOut, isRecording,
  autoRotate, onViewChange, source,
}) {
  const canvasRef = React.useRef(null);
  const containerRef = React.useRef(null);
  const [dims, setDims] = React.useState({ w: 800, h: 600 });
  const viewRef = React.useRef({ yaw: 0.6, pitch: 1.05, zoom: 1 });
  const dragRef = React.useRef(null);
  const pointersRef = React.useRef(new Map());
  const pinchRef = React.useRef(null);
  const tRef = React.useRef(0);
  const traceRef = React.useRef([]);
  const traceAdvRef = React.useRef(0);
  const lastTsRef = React.useRef(0);
  const lastViewSentRef = React.useRef(0);

  React.useEffect(() => {
    const el = containerRef.current;
    const ro = new ResizeObserver(() => {
      const r = el.getBoundingClientRect();
      setDims({ w: Math.floor(r.width), h: Math.floor(r.height) });
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  React.useEffect(() => {
    if (canvasRefOut) canvasRefOut.current = canvasRef.current;
    if (seekRef) seekRef.current = (nt) => { tRef.current = nt; traceRef.current = []; traceAdvRef.current = 0; };
  });

  React.useEffect(() => { traceRef.current = []; traceAdvRef.current = 0; tRef.current = 0; }, [terms]);
  React.useEffect(() => { traceRef.current = []; traceAdvRef.current = 0; }, [N, trailMode]);

  React.useEffect(() => {
    const el = canvasRef.current;
    const onWheel = (e) => {
      e.preventDefault();
      const v = viewRef.current;
      v.zoom = Math.min(6, Math.max(0.2, v.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, []);

  // Source curve + floor height (for the shadow), recomputed per shape
  const geom = React.useMemo(() => {
    if (!terms || !terms.length) return null;
    const pts = [];
    for (let i = 0; i <= 360; i++) pts.push(tip3d(terms, i / 360, Infinity));
    let zMin = Infinity, rMax = 1;
    for (const p of pts) { zMin = Math.min(zMin, p.z); rMax = Math.max(rMax, Math.hypot(p.x, p.y, p.z)); }
    return { pts, floor: zMin - 50, rMax };
  }, [terms]);

  React.useEffect(() => {
    const c = canvasRef.current;
    const dpr = window.devicePixelRatio || 1;
    c.width = dims.w * dpr; c.height = dims.h * dpr;
    c.style.width = dims.w + 'px'; c.style.height = dims.h + 'px';
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!terms || !terms.length || !geom) { ctx.clearRect(0, 0, dims.w, dims.h); return; }

    const maxAge = trailMode === 'infinite' ? Infinity : trailMode === 'long' ? 3.0 : 1.2;
    const tColor = traceColor || theme.trace;
    const tWidth = traceWidth || 2.2;
    let raf;

    const tick = (ts) => {
      if (!lastTsRef.current) lastTsRef.current = ts;
      const dt = Math.min((ts - lastTsRef.current) / 1000, 0.05);
      lastTsRef.current = ts;
      const v = viewRef.current;
      if (autoRotate && !dragRef.current && pointersRef.current.size === 0) v.yaw += dt * 0.25;
      if (onViewChange && ts - lastViewSentRef.current > 100) {
        lastViewSentRef.current = ts;
        onViewChange(v.yaw, v.pitch);
      }

      const prevT = tRef.current;
      if (playing) tRef.current = (tRef.current + dt * speed) % 1;
      const t = tRef.current;
      onTimeUpdate && onTimeUpdate(t);

      if (playing && !(maxAge === Infinity && traceAdvRef.current >= 1)) {
        const adv = dt * speed;
        const steps = Math.min(64, Math.max(1, Math.ceil(adv * 1500)));
        for (let k = 1; k <= steps; k++) {
          const p = tip3d(terms, (prevT + (adv * k) / steps) % 1, N);
          traceRef.current.push({ ...p, age: (dt * (steps - k)) / steps });
          if (maxAge === Infinity && traceAdvRef.current + (adv * k) / steps >= 1) break;
        }
        traceAdvRef.current += adv;
      }
      for (const p of traceRef.current) p.age += dt;
      if (maxAge !== Infinity) traceRef.current = traceRef.current.filter((p) => p.age < maxAge);

      // Projection
      const rot = makeRot(v.yaw, v.pitch);
      const D = 1600;
      const S = (Math.min(dims.w, dims.h) / 700) * v.zoom;

// Listen: the inverse of Sound. Audio from the mic or a file is cut into
// frames; an FFT autocorrelation finds the pitch f0, and the harmonics at
// n·f0 become epicycles of frequency n. One loop of the curve is one period
// of the waveform, so every timbre draws its own closed shape.

// In-place radix-2 FFT (length must be a power of two).
function fftInPlace(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      let tmp = re[i]; re[i] = re[j]; re[j] = tmp;
      tmp = im[i]; im[i] = im[j]; im[j] = tmp;
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const half = len >> 1, ang = (-2 * Math.PI) / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < half; k++) {
        const a = i + k, b = a + half;
        const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti;
        re[a] += tr; im[a] += ti;
        const nc = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nc;
      }
    }
  }
}

// McLeod pitch method: normalized square difference via FFT autocorrelation.
// Returns { freq, clarity } or null when nothing periodic is found.
function detectPitch(x, sr, minF = 55, maxF = 1600) {

  const sig = re.slice(0, W);
  fftInPlace(re, im);
  for (let i = 0; i < n; i++) { re[i] = re[i] * re[i] + im[i] * im[i]; im[i] = 0; }
  fftInPlace(re, im); // power spectrum is real and even, so a forward FFT inverts it

  const peaks = [];
  let tau = 1;

    if (nsdf[tau] > 0 && nsdf[tau - 1] <= 0) best = tau;
    else if (nsdf[tau] > 0 && best >= 0 && nsdf[tau] > nsdf[best]) best = tau;
    if (best >= 0 && (nsdf[tau] <= 0 || tau === tauMax)) {
      if (best >= tauMin) peaks.push(best);

// Complex amplitude of each harmonic h·f0 (h = 1..K) over a Hann window,
// phases measured from the frame centre: x(t) ≈ Σ Re(c_h e^{i2πh f0 t}).

    this.smooth = next;
    this.coeffs = [...next.entries()]
      .map(([freq, c]) => ({ freq, re: c.re, im: c.im, amp: Math.hypot(c.re, c.im), phase: Math.atan2(c.im, c.re) }))
      .sort((a, b) => b.amp - a.amp);
    return true;
  }
}

// Audio plumbing: one context, a mic or file source, and analysers per channel.
class AudioInput {
  constructor(size = 4096) {
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.input = this.ctx.createGain();
    const split = this.ctx.createChannelSplitter(2);
    this.anL = this.ctx.createAnalyser();
    this.anR = this.ctx.createAnalyser();
    this.anL.fftSize = this.anR.fftSize = size;
    this.anL.smoothingTimeConstant = this.anR.smoothingTimeConstant = 0;
    this.input.connect(split);
    split.connect(this.anL, 0);
    split.connect(this.anR, 1);
    this.out = this.ctx.createGain();
    this.out.connect(this.ctx.destination);
    this.kind = null;       // 'mic' | 'file'
    this.buffer = null;     // decoded file
    this.fileSrc = null;
    this.offset = 0;        // file position when paused
    this.startedAt = 0;
    this.playing = false;
    this.onEnded = null;
  }

  get stereo() { return this.kind === 'file' && this.buffer && this.buffer.numberOfChannels > 1; }
  get duration() { return this.buffer ? this.buffer.duration : 0; }
  get position() {
    if (!this.buffer) return 0;
    return this.playing ? Math.min(this.duration, this.ctx.currentTime - this.startedAt) : this.offset;
  }

  async startMic() {
    this.stopFile();
    await this.ctx.resume();
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    this.micSrc = this.ctx.createMediaStreamSource(this.stream);
    this.micSrc.connect(this.input);
    this.kind = 'mic';
  }

  stopMic() {
    if (this.micSrc) this.micSrc.disconnect();
    if (this.stream) this.stream.getTracks().forEach((t) => t.stop());
    this.micSrc = this.stream = null;
    if (this.kind === 'mic') this.kind = null;
  }

  async loadFile(file) {
    this.stopMic();
    this.stopFile();
    const data = await file.arrayBuffer();
    this.buffer = await new Promise((res, rej) => this.ctx.decodeAudioData(data, res, rej));
    this.kind = 'file';
    this.offset = 0;
  }

  play(from = this.offset) {
    if (!this.buffer) return;
    this.ctx.resume();
    this.halt();
    const src = this.ctx.createBufferSource();
    src.buffer = this.buffer;
    src.connect(this.input);
    src.connect(this.out);
    const at = from >= this.duration - 0.05 ? 0 : from;
    src.start(0, at);
    src.onended = () => {
      if (this.fileSrc !== src) return;
      this.playing = false; this.offset = 0; this.fileSrc = null;
      this.onEnded && this.onEnded();
    };
    this.fileSrc = src;
    this.startedAt = this.ctx.currentTime - at;
    this.playing = true;
  }

  halt() {
    if (!this.fileSrc) return;
    const src = this.fileSrc;
    this.fileSrc = null;
    try { src.stop(); } catch (e) {}
    src.disconnect();
  }

  pause() {
    if (!this.playing) return;
    this.offset = this.position;
    this.halt();
    this.playing = false;
  }

  seek(t) {
    if (this.playing) this.play(t); else this.offset = t;
  }

  stopFile() {
    this.halt();
    this.playing = false;
    this.offset = 0;
  }

  dispose() {
    this.stopMic();
    this.stopFile();
    this.ctx.close();
  }
}

// Live panel: note name, FFT spectrum with harmonic markers, and the melody
// as a scrolling pitch trail. Reads the analyser directly every frame.
function ListenPanel({ analyser, theme, tr, K }) {
  const ref = React.useRef(null);
  const W = 260, H = 210;
  React.useEffect(() => {
    const c = ref.current;
    if (!c || !analyser) return;
    const dpr = window.devicePixelRatio || 1;
    c.width = W * dpr; c.height = H * dpr;
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const mono = '"JetBrains Mono", monospace';
    const fMin = 40, fMax = 8000;
    const fx = (f) => (Math.log(f / fMin) / Math.log(fMax / fMin)) * W;
    let raf;
    const draw = () => {
      const a = analyser;
      ctx.clearRect(0, 0, W, H);

      // Note readout
      ctx.fillStyle = theme.ink;
      ctx.font = `500 22px ${mono}`;
      const named = a.midi !== null && a.f0 ? midiToName(Math.round(a.midi)) : '—';
      ctx.fillText(named, 0, 22);
      ctx.font = `10px ${mono}`;
      ctx.fillStyle = theme.muted;
      if (a.midi !== null && a.f0) {
        const cents = Math.round((a.midi - Math.round(a.midi)) * 100);
        ctx.fillText(`${a.f0.toFixed(1)} Hz  ${cents >= 0 ? '+' : ''}${cents}¢`, 0, 38);
      }
      ctx.textAlign = 'right';
      ctx.fillText(a.voiced ? tr.audioListening : tr.audioNoPitch, W, 22);
      ctx.textAlign = 'left';

      // FFT spectrum
      const sy = 50, sh = 70;
      ctx.strokeStyle = theme.grid;
      ctx.lineWidth = 1;
      ctx.strokeRect(0.5, sy + 0.5, W - 1, sh);
      if (a.sr) {
        const bins = a.spectrum.length, binHz = a.sr / (bins * 2);
        ctx.beginPath();
        ctx.moveTo(0, sy + sh);
        for (let px = 0; px <= W; px++) {
          const f0 = fMin * Math.pow(fMax / fMin, px / W), f1 = fMin * Math.pow(fMax / fMin, (px + 1) / W);
          let peak = -200;
          for (let b = Math.floor(f0 / binHz); b <= Math.ceil(f1 / binHz) && b < bins; b++) peak = Math.max(peak, a.spectrum[b]);
          const v = Math.max(0, Math.min(1, (peak + 90) / 80));
          ctx.lineTo(px, sy + sh - v * sh);
        }
        ctx.lineTo(W, sy + sh);
        ctx.closePath();
        ctx.fillStyle = hexWithAlpha(theme.accent, 0.25);
        ctx.fill();
        ctx.strokeStyle = theme.accent;
        ctx.stroke();
        if (a.voiced) {
          ctx.strokeStyle = theme.ink;
          ctx.globalAlpha = 0.5;
          ctx.setLineDash([2, 3]);
          for (let h = 1; h <= K && h * a.f0 < fMax; h++) {
            const x = fx(h * a.f0) + 0.5;
            ctx.beginPath(); ctx.moveTo(x, sy); ctx.lineTo(x, sy + sh); ctx.stroke();
          }
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
        }
      }
      ctx.fillStyle = theme.muted;
      ctx.font = `9px ${mono}`;
      for (const f of [100, 1000]) ctx.fillText(f >= 1000 ? '1k' : `${f}`, fx(f) + 2, sy + sh - 3);
      ctx.fillText('FFT', 3, sy + 10);

      // Melody trail: last 8 s of pitch, newest at the right
      const py = 136, ph = H - py;
      ctx.strokeStyle = theme.grid;
      ctx.strokeRect(0.5, py + 0.5, W - 1, ph - 1);
      const hist = a.history;
      const notes = hist.filter((p) => p.midi !== null).map((p) => p.midi);
      if (notes.length) {
        let lo = Math.floor(Math.min(...notes)) - 2, hi = Math.ceil(Math.max(...notes)) + 2;
        if (hi - lo < 12) { const mid = (hi + lo) / 2; lo = mid - 6; hi = mid + 6; }
        const now = hist[hist.length - 1].time;
        const xOf = (t) => W - ((now - t) / 8) * W;
        const yOf = (m) => py + ph - 4 - ((m - lo) / (hi - lo)) * (ph - 8);
        // semitone guides at C's
        ctx.fillStyle = theme.muted;
        for (let m = Math.ceil(lo); m <= hi; m++) {
          if (m % 12 !== 0) continue;
          ctx.fillRect(0, Math.round(yOf(m)) + 0.5, W, 1);
          ctx.fillText(midiToName(m), 3, yOf(m) - 2);
        }
        ctx.strokeStyle = theme.trace;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        let pen = false, prev = null;
        for (const p of hist) {
          if (p.midi === null || (prev !== null && Math.abs(p.midi - prev) > 1.5)) pen = false;
          if (p.midi !== null) {
            const x = xOf(p.time), y = yOf(p.midi);
            if (pen) ctx.lineTo(x, y); else ctx.moveTo(x, y);
            pen = true;
          }
          prev = p.midi;
        }
        ctx.stroke();
      } else {
        ctx.fillStyle = theme.muted;
        ctx.fillText(tr.audioMelody, 4, py + 13);
      }
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(raf);
  }, [analyser, theme, tr, K]);
  return (
    <div style={{
      background: theme.panel, border: `1px solid ${theme.line}`, borderRadius: 8,
      padding: 10, boxShadow: '0 4px 20px rgba(0,0,0,0.08)',
    }}>
      <canvas ref={ref} style={{ width: W, height: H, display: 'block' }} />
    </div>
  );
}

Object.assign(window, { fftInPlace, detectPitch, harmonicsAt, harmonicsToCoeffs, alignAndScale, AudioShapeAnalyser, AudioInput, ListenPanel });

<script type="text/babel">
// Main App: layout, state, tweaks bridge.

const { useState, useEffect, useRef, useMemo, useCallback } = React;

// URL state encode/decode (feature 7)
function encodeURLState({ preset, coeffs, N, speed, phaseOffset, traceColor, traceWidth, themeKey, mode, vectors, morphA, morphB, shape3d, knotP, knotQ }) {
  const o = { v: 1 };
  if (preset) {
    o.p = preset;
  } else if (coeffs && coeffs.length) {
    o.c = coeffs.slice(0, 60).map((c) => [c.freq, +c.amp.toFixed(2), +c.phase.toFixed(4)]);
  }
  if (N !== 60) o.n = N;
  if (Math.abs(speed - 0.25) > 0.001) o.s = +speed.toFixed(3);
  if (phaseOffset) o.po = +phaseOffset.toFixed(4);
  if (traceColor) o.tc = traceColor;
  if (Math.abs(traceWidth - 2.2) > 0.1) o.tw = traceWidth;
  if (themeKey !== 'paper') o.th = themeKey;
  if (mode === 'studio') {
    o.m = 's';
    if (vectors) o.vec = vectors.map((v) => [v.freq, +v.amp.toFixed(2), +v.phase.toFixed(4)]);
  }
  if (mode === '3d') {
    delete o.c; delete o.p;
    o.m = '3'; o.s3 = shape3d;
    if (shape3d === 'torus') { o.kp = knotP; o.kq = knotQ; }
  }
  if (mode === 'morph' && PRESETS[morphA] && PRESETS[morphB]) {
    o.m = 'm'; o.ma = morphA; o.mb = morphB;
  }
  return btoa(JSON.stringify(o));
}

function decodeURLState(hash) {
  try {
    return JSON.parse(atob(hash.replace(/^#s=/, '')));
  } catch { return null; }
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "paper",

function App() {

  const [speed, setSpeed] = useState(TWEAK_DEFAULTS.defaultSpeed);

  const histIdxRef = useRef(-1);

  // stroke customization
  const [traceColor, setTraceColor] = useState(null); // null = theme default

  const [imageSpeed, setImageSpeed] = useState(0.04);
  const [imageDetail, setImageDetail] = useState(0.25);

  // When a preset is chosen, compute coefficients.
  const applyPath = useCallback((points, presetKey = null) => {
    if (!points || points.length < 4) return;
    const closed = closePath(points);
    const { centered } = centerPath(closed);
    const resampled = resamplePath(centered, 512);
    const c = dft(resampled);
    setUserPath(centered);
    setPathResampled(resampled);
    setCoeffs(c);
    setPlaying(true);
    const h = historyRef.current.slice(0, histIdxRef.current + 1);
    h.push({ userPath: centered, coeffs: c, preset: presetKey });
    if (h.length > 50) h.shift();
    historyRef.current = h;
    histIdxRef.current = h.length - 1;
  }, []);

  const restoreFromURLState = useCallback((decoded) => {
    if (!decoded) return false;
    if (decoded.p && PRESETS[decoded.p]) {

      applyPath(PRESETS[decoded.p].fn(), decoded.p);
    } else if (decoded.c) {
      const rc = decoded.c.map(([freq, amp, phase]) => ({ freq, amp, phase, re: amp * Math.cos(phase), im: amp * Math.sin(phase) }));

      setPlaying(true);

    if (decoded.s !== undefined) setSpeed(decoded.s);
    if (decoded.po) setPhaseOffset(decoded.po);
    if (decoded.tc) setTraceColor(decoded.tc);
    if (decoded.tw !== undefined) setTraceWidth(decoded.tw);
    if (decoded.th) setThemeKey(decoded.th);
    if (decoded.m === 's') {
      setMode('studio');
      if (decoded.vec) setVectors(decoded.vec.map((v, i) => ({ id: i + 1, freq: v[0], amp: v[1], phase: v[2] })));
    }
    if (decoded.m === '3' && PRESETS_3D[decoded.s3]) {
      setShape3d(decoded.s3);
      if (decoded.kp) setKnotP(decoded.kp);
      if (decoded.kq) setKnotQ(decoded.kq);
      setMode('3d');
      applyPath(PRESETS.heart.fn(), 'heart');
    }
    if (decoded.m === 'm' && PRESETS[decoded.ma] && PRESETS[decoded.mb]) {
      setMorphA(decoded.ma); setMorphB(decoded.mb); setMode('morph');
      if (!decoded.p && !decoded.c) applyPath(PRESETS.heart.fn(), 'heart');
    }
    return true;
  }, [applyPath]);

  // Load default preset on mount (or restore from URL hash)
  useEffect(() => {

  const [knotP, setKnotP] = useState(2);
  const [knotQ, setKnotQ] = useState(3);

  }, []);
  // What the current view sees, as 2D coefficients — feeds sound and export
  const proj3d = useMemo(
    () => (mode === '3d' ? project3dToCoeffs(terms3d.slice(0, N3), view3d.yaw, view3d.pitch) : null),
    [mode, terms3d, N3, view3d],

  const analyser = useMemo(() => new AudioShapeAnalyser(), []);

  const [audioSource, setAudioSource] = useState(null);    // 'mic' | 'file' | null
  const [audioName, setAudioName] = useState('');

  const [audioK, setAudioK] = useState(16);

  const [audioError, setAudioError] = useState(null);      // 'mic' | 'decode'

    let raf, lastSnap = 0;
    const tick = (ts) => {
      const stereo = a.stereo;
      a.anL.getFloatTimeDomainData(L);
      if (stereo) {
        a.anR.getFloatTimeDomainData(R);
        for (let i = 0; i < size; i++) X[i] = 0.5 * (L[i] + R[i]);
      }
      const xy = stereo && audioStereo;
      if ((a.kind === 'mic' || a.playing) &&

    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });

      a.href = url; a.download = 'fourier-canvas.webm'; a.click();

              </div>
              <Toggle label={tr.showMathPanel} value={showMath} onChange={(v) => { setShowMath(v); setTweak('showMath', v); }} theme={theme} />
              <Slider label={tr.defaultN} value={N} min={1} max={maxN} step={1} theme={theme}
                onChange={(v) => { setN(v); setTweak('defaultN', v); }}
                format={(v) => `${v}`} />
              <Slider label={tr.defaultSpeed} value={speed} min={0.02} max={1.5} step={0.01} theme={theme}
                onChange={(v) => { setSpeed(v); setTweak('defaultSpeed', v); }}
                format={(v) => `${v.toFixed(2)}×`} />
            </div>
          </div>
        )}
      </main>
    </div>
  );
}

function SectionLabel({ children, theme }) {
  return (
    <div style={{
      fontFamily: 'JetBrains Mono, monospace',
      fontSize: 10, letterSpacing: 2.5, textTransform: 'uppercase',
      color: theme.muted, marginBottom: 10,
    }}>{children}</div>
  );
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space') {
    e.preventDefault();
    window.__togglePlay && window.__togglePlay();
  }
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ' && !e.shiftKey) {
    e.preventDefault();
    window.__undo && window.__undo();
  }
  if ((e.ctrlKey || e.metaKey) && (e.code === 'KeyY' || (e.code === 'KeyZ' && e.shiftKey))) {
    e.preventDefault();
    window.__redo && window.__redo();
  }
});

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
